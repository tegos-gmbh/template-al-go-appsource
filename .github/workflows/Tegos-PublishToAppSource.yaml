name: 'Tegos - Publish To AppSource'
run-name: 'Tegos - Publish To AppSource (${{ github.event.release.tag_name }})'

# Event-driven: this workflow reacts to a GitHub Release being published.
#
# Why 'release' and not 'workflow_run' on 'Create release':
#   The 'Create release' workflow is dispatched (workflow_dispatch) by the
#   'Tegos - Release' workflow using the default GITHUB_TOKEN. GitHub suppresses
#   the cascading 'workflow_run: completed' event for any run that was triggered
#   by GITHUB_TOKEN, so a downstream 'workflow_run' trigger never fires.
#
#   However, AL-Go's CreateRelease creates the GitHub Release using
#   'TokenForPush' (the ghTokenWorkflow token, because we dispatch CreateRelease
#   with useGhTokenWorkflow=true). Events produced by a non-GITHUB_TOKEN DO
#   cascade, so the 'release' event fires reliably - we hook into that instead.
on:
  release:
    types: [ published ]

# Dispatching the PublishToAppSource workflow requires write access to actions.
permissions:
  actions: write
  contents: read

# Avoid overlapping publish dispatches for the same release tag.
concurrency:
  group: tegos-publishtoappsource-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  ALGO_SETTINGS_PATH: '.AL-Go/settings.json'
  APPSOURCE_WORKFLOW: 'PublishToAppSource.yaml'

jobs:
  publish-to-appsource:
    name: Publish to AppSource
    # Only publish full releases - never drafts or pre-releases.
    if: ${{ github.event.release.draft == false && github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read settings.json as it was at the released tag.
          ref: ${{ github.event.release.tag_name }}

      - name: Check publish settings
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const settingsPath = process.env.ALGO_SETTINGS_PATH;

            // Default: publish to AppSource. The setting is optional - when it is
            // missing (or settings.json itself is missing) publishing is enabled.
            let enabled = true;

            if (fs.existsSync(settingsPath)) {
              try {
                const settings = JSON.parse(fs.readFileSync(settingsPath, 'utf8'));
                if (Object.prototype.hasOwnProperty.call(settings, 'tegosPublishToAppSourceEnabled')) {
                  enabled = settings.tegosPublishToAppSourceEnabled === true;
                }
              } catch (err) {
                core.warning(`Failed to parse '${settingsPath}': ${err.message}. Publishing stays enabled.`);
              }
            } else {
              core.info(`'${settingsPath}' not found. Publishing stays enabled.`);
            }

            core.info(`Publish to AppSource enabled: ${enabled}`);
            core.setOutput('enabled', String(enabled));
            if (!enabled) {
              core.notice("Publish to AppSource is disabled via 'tegosPublishToAppSourceEnabled' in .AL-Go/settings.json. Skipping.");
            }

      # Guardrail: PublishToAppSource resolves appVersion='current' to the latest
      # release and delivers whatever app packages are attached to it. The release
      # tag (e.g. 28.10.0) is derived independently from the artifact version
      # (e.g. app-master-Apps-28.9.12.0.zip), so a tag can point at binaries of a
      # different version. We refuse to publish when the tag's Major.Minor does not
      # match the Major.Minor of the app artifacts attached to the release.
      - name: Validate release artifacts match tag
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releaseId = Number(process.env.RELEASE_ID);

            // Derive Major.Minor from the release tag (tolerate an optional 'v' prefix).
            const tagMatch = /^v?(\d+)\.(\d+)(?:\.|$)/.exec(tag || '');
            if (!tagMatch) {
              core.setFailed(`Release tag '${tag}' is not in the expected Major.Minor[.Build] format.`);
              return;
            }
            const tagMajorMinor = `${tagMatch[1]}.${tagMatch[2]}`;
            core.info(`Release tag '${tag}' -> Major.Minor '${tagMajorMinor}'`);

            // Fetch the assets attached to the release (do not trust the event
            // payload snapshot - list them via the API for an authoritative view).
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            // App artifact zips are named like '<project>-<branch>-Apps-<version>.zip'.
            const appAssetRegex = /-Apps-(\d+\.\d+\.\d+(?:\.\d+)?)\.zip$/i;
            const appAssets = assets
              .map(a => ({ name: a.name, match: appAssetRegex.exec(a.name) }))
              .filter(a => a.match);

            if (appAssets.length === 0) {
              core.setFailed(`No app artifact assets ('*-Apps-<version>.zip') found on release '${tag}'. Cannot validate the delivered version - refusing to publish.`);
              return;
            }

            const rows = [];
            const mismatches = [];
            for (const asset of appAssets) {
              const version = asset.match[1];
              const versionMatch = /^(\d+)\.(\d+)/.exec(version);
              const artifactMajorMinor = `${versionMatch[1]}.${versionMatch[2]}`;
              const ok = artifactMajorMinor === tagMajorMinor;
              rows.push([asset.name, version, ok ? 'OK' : 'MISMATCH']);
              if (!ok) {
                mismatches.push(`${asset.name} (artifact ${artifactMajorMinor} != tag ${tagMajorMinor})`);
              }
            }

            await core.summary
              .addHeading('Release artifact version check', 2)
              .addTable([
                [{ data: 'Asset', header: true }, { data: 'Artifact version', header: true }, { data: 'Result', header: true }],
                ...rows,
              ])
              .write();

            if (mismatches.length > 0) {
              core.setFailed(
                `Release '${tag}' contains app artifacts whose Major.Minor does not match the tag ` +
                `(expected '${tagMajorMinor}'):\n- ${mismatches.join('\n- ')}\n` +
                `Publishing to AppSource is blocked to avoid delivering the wrong version.`
              );
              return;
            }

            core.info(`All ${appAssets.length} app artifact(s) match the tag Major.Minor '${tagMajorMinor}'. Proceeding.`);

      - name: Trigger PublishToAppSource
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/github-script@v7
        env:
          # workflow_dispatch needs a branch/tag ref; the default branch is the
          # safe choice (the release commitish may be a bare SHA, which is not
          # a valid dispatch ref).
          TARGET_REF: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          script: |
            const workflowId = process.env.APPSOURCE_WORKFLOW;
            const ref = process.env.TARGET_REF;
            const tag = process.env.RELEASE_TAG;

            core.info(`Dispatching '${workflowId}' for release '${tag}' | appVersion='current' projects='*' GoLive=true ref='${ref}'`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref,
              inputs: {
                appVersion: 'current',
                projects: '*',
                GoLive: 'true',
              },
            });

            core.info(`'${workflowId}' dispatched successfully.`);
            await core.summary
              .addHeading('Publish to AppSource dispatched', 2)
              .addTable([
                [{ data: 'Property', header: true }, { data: 'Value', header: true }],
                ['Release tag', tag],
                ['Dispatch ref', ref],
                ['App version to deliver', 'current'],
                ['Projects to publish', '* (all)'],
                ['Promote AppSource app to go live', 'yes'],
              ])
              .write();
